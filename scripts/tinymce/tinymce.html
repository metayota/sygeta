<div class="form-tinymce form-box {this.class} {!!this.errorMessage ? 'has-error' : ''}"> 
	<label if="this.label !== undefined" class="form-label">{translate(this.label)}</label>
    <textarea style="visibility:hidden;height:400px;" element="textarea" id="{this.textarea_id}">{this._value}</textarea>
</div>
