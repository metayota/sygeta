paths:
  list:
    get:
      summary: Get all contact groups
      description: Retrieves a list of all contact groups with translated titles based on Accept-Language header
      operationId: listContactGroups
      tags:
        - Contact Groups
      parameters:
        - name: Accept-Language
          in: header
          required: false
          description: Language code for translations (e.g., en, de, fr)
          schema:
            type: string
            default: en
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactGroup'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
      security:
        - bearerAuth: []
        - sessionAuth: []

components:
  schemas:
    ContactGroup:
      type: object
      properties:
        name:
          type: string
          description: Name of the contact group
          example: "VIP Customers"
        title:
          type: string
          nullable: true
          description: Translated title of the contact group
          example: "VIP Customers"
      required:
        - name