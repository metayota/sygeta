paths:
  list:
    get:
      summary: List all partners
      description: Retrieves all partners with translated role names based on the Accept-Language header
      operationId: listPartners
      tags:
        - Partners
      parameters:
        - in: header
          name: Accept-Language
          schema:
            type: string
            example: en
          description: Language code for translations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partner'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient permissions

components:
  schemas:
    PartnerId:
      type: integer
      nullable: true
      description: Partner ID
      example: 1

    Partner:
      type: object
      properties:
        id:
          type: integer
          description: Partner ID
          example: 1
        user_id:
          type: integer
          nullable: true
          description: Associated user ID
          example: 42
        full_name:
          type: string
          nullable: true
          description: Full name of the partner
          example: John Doe
        contact_id:
          type: integer
          nullable: true
          description: Associated contact ID
          example: 123
        supervisor_partner_id:
          type: integer
          nullable: true
          description: ID of the supervisor partner
          example: 5
        role_name:
          type: string
          nullable: true
          description: Translated role name
          example: Sales Manager
        commission:
          type: number
          format: decimal
          nullable: true
          description: Commission percentage
          example: 15.50