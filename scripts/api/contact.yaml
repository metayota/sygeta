paths:

  listCreate:
    post:
      summary: Create a new contact
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ContactCreateRequest"
            example:
              salutation: "mister"
              firstname: "Michael"
              lastname: "Reynolds"
              full_name: "Michael Reynolds"
              email: "m.reynolds@example.com"
              phone: "+1 415 555 2983"
              street: "1258 Market Street"
              zip_code: "94103"
              city: "San Francisco"
              country: "US"
              language: "en"
              timezone: "America/Los_Angeles"
              company: "Reynolds Digital Solutions LLC"
              department: "Business Development"
              contact_groups: ["prospective_customer", "linkedin"]

      responses:
        "200":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/schemas/ContactCreateResponse"
              example:
                id: 42
                message: "Contact created successfully"

    put:
      summary: Create or update contact by email
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ContactUpsertRequest"
            example:
              firstname: "Michael"
              lastname: "Reynolds"
              email: "m.reynolds@example.com"
              language: "en"

      responses:
        "200":
          description: Contact saved
          content:
            application/json:
              schema:
                $ref: "#/schemas/ContactResponse"
              example:
                id: 42
                message: "Contact updated successfully"


  detail:
    get:
      summary: Get contact by ID
      tags: [Contact]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contact found
          content:
            application/json:
              schema:
                $ref: "#/schemas/ContactDetail"
              example:
                id: 42
                salutation: "mister"
                firstname: "Michael"
                lastname: "Reynolds"
                full_name: "Michael Reynolds"
                company: "Reynolds Digital Solutions LLC"
                department: "Business Development"
                email: "m.reynolds@example.com"
                website: "https://reynolds-digital.com"
                phone: "+1 415 555 2983"
                street: "1258 Market Street"
                zip_code: "94103"
                city: "San Francisco"
                country: "US"
                language: "en"
                timezone: "America/Los_Angeles"
                contact_type_id: 1
                step_type_id: 1
                partner_id: 5
                user_id: 10
                access_key: "ABCD-EFGH-IJKL"
                created_at: "2025-01-10T13:25:00Z"
                updated_at: "2025-01-15T14:45:00Z"
        "404":
          description: Contact not found

    patch:
      summary: Update an existing contact
      tags: [Contact]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ContactUpdateRequest"
            example:
              phone: "+1 415 555 7712"
              department: "Enterprise Accounts"

      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/schemas/ContactResponse"
              example:
                id: 42
                message: "Contact updated successfully"
        "404":
          description: Contact not found

    delete:
      summary: Delete a contact
      tags: [Contact]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contact deleted successfully"
        "404":
          description: Contact not found


schemas:

  ContactCreateRequest:
    type: object
    required: [email, language]
    properties:
      salutation:
        type: string
        enum: [mister, miss, diverse]
      company: { type: string }
      department: { type: string }
      full_name: { type: string }
      firstname: { type: string }
      lastname: { type: string }
      email:
        type: string
        format: email
      website: { type: string }
      phone: { type: string }
      street: { type: string }
      zip_code: { type: string }
      city: { type: string }
      country: { type: string }
      language: { type: string }
      timezone:
        $ref: "./timezone.yaml#/schemas/Timezone"
      contact_type_id: { type: integer }
      contact_groups:
        type: array
        items: { type: string }
      step_type_id: { type: integer }
      partner_id:
        $ref: "./partner.yaml#/components/schemas/PartnerId"
      user_id:
        $ref: "./user.yaml#/schemas/UserId"


  ContactUpdateRequest:
    type: object
    properties:
      salutation:
        type: string
        enum: [mister, miss, diverse]
      company: { type: string }
      department: { type: string }
      full_name: { type: string }
      firstname: { type: string }
      lastname: { type: string }
      email: { type: string }
      website: { type: string }
      phone: { type: string }
      street: { type: string }
      zip_code: { type: string }
      city: { type: string }
      country: { type: string }
      language: { type: string }
      timezone:
        $ref: "./timezone.yaml#/schemas/Timezone"
      contact_type_id: { type: integer }
      contact_groups:
        type: array
        items: { type: string }
      step_type_id: { type: integer }
      partner_id:
        $ref: "./partner.yaml#/components/schemas/PartnerId"
      user_id:
        $ref: "./user.yaml#/schemas/UserId"


  ContactUpsertRequest:
    allOf:
      - $ref: "#/schemas/ContactCreateRequest"


  ContactCreateResponse:
    type: object
    properties:
      id: { type: integer }
      message: { type: string }


  ContactResponse:
    type: object
    properties:
      id: { type: integer }
      message: { type: string }


  ContactDetail:
    type: object
    properties:
      id: { type: integer }
      salutation: { type: string }
      company: { type: string, nullable: true }
      department: { type: string, nullable: true }
      full_name: { type: string }
      firstname: { type: string }
      lastname: { type: string }
      email: { type: string }
      website: { type: string, nullable: true }
      phone: { type: string, nullable: true }
      street: { type: string, nullable: true }
      zip_code: { type: string, nullable: true }
      city: { type: string, nullable: true }
      country: { type: string, nullable: true }
      language: { type: string }
      timezone:
        $ref: "./timezone.yaml#/schemas/Timezone"
      contact_type_id: { type: integer }
      step_type_id: { type: integer }
      partner_id:
        $ref: "./partner.yaml#/components/schemas/PartnerId"
      user_id:
        $ref: "./user.yaml#/schemas/UserId"
      access_key: { type: string }
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

