<h3 if="this.label != undefined">{this.label}</h3>

<div if="this.parameters != undefined">
    <div class="parameters" for="parameter of this.parameters">
        <div if="((this.readonly === true || parameter.readonly === true) && parameter.value) && !this.isHidden(parameter)">
            <object.viewparameter readonly="{parameter.readonly}" documentation="{this.documentation}" parameter="{parameter}" value="{parameter.value}" name="{parameter.name}"></object.viewparameter>
        </div>
 
        <div if="this.readonly !== true && (!parameter.readonly || (!parameter.value && parameter.required)) && !this.isHidden(parameter)" class="parameter-type-{parameter.type} parameter-name-{parameter.name}">
            <form.element required="{parameter.required}" validators="{parameter.validators}" (change)="this.parameterChanged(parameter.name,event)" name="{parameter.name}" label="{parameter.title}" type="{parameter.type}" value="{parameter.value}" options="{parameter.options}" parent_tag="{this.parent_reference}"></form.element> 
            <div class="element-documentation" if="this.showdocumentation && parameter.documentation && parameter.documentation != ''">{parameter.documentation}</div>
        </div>
    </div>
</div>
